services:
  worker:
    image: reelay:local
    build: .
    init: true
    restart: unless-stopped
    # .env 只剩部署参数；旧版本写在里面的设置首次启动时导入管理台
    env_file: .env
    volumes:
      # 数据库、配置、密钥、会话、115 凭证与日志都在这个数据卷里
      - reelay-data:/app/data
      # 外部扩展（只读）
      - ./deploy/plugins:/app/data/plugins:ro
      # 仅用于从旧版本迁移：首次启动把 deploy/config/config.yaml 移进数据卷，之后可以删掉这一行
      - ./deploy/config:/app/config
    healthcheck:
      test: ["CMD", "python", "-m", "reelay.core.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 120s

  web:
    image: reelay:local
    build: .
    init: true
    command: ["python", "-m", "reelay.web"]
    restart: unless-stopped
    env_file: .env
    environment:
      REELAY_WEB_HOST: 0.0.0.0
      REELAY_WEB_PORT: "28080"
    volumes:
      - reelay-data:/app/data
      - ./deploy/plugins:/app/data/plugins:ro
      - ./deploy/config:/app/config
    ports:
      - "127.0.0.1:28080:28080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:28080/api/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 120s

volumes:
  reelay-data:
