[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelay"
version = "0.1.0"
description = "监听 Telegram 资源 Bot，AI 识别影视资源与 115 链接，审批后转存并整理入库。可扩展内核骨架。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
# 接入真实能力时安装：pip install -e ".[full]"
full = [
    "telethon>=1.36",
    "p115client==0.0.9.6.5.1",
    "qrcode>=7.4,<9",
    "openai>=1.40",
    "PyYAML>=6.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx2>=0.1",
    "PyYAML>=6.0",
]
agent = ["mcp>=1.2"]
all = [
    "telethon>=1.36",
    "p115client==0.0.9.6.5.1",
    "qrcode>=7.4,<9",
    "openai>=1.40",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx2>=0.1",
    "mcp>=1.2",
]

[project.scripts]
reelay = "reelay.main:main"
reelay-web = "reelay.web:main"
reelay-mcp = "reelay.mcp_server:main"

[tool.setuptools.packages.find]
include = ["reelay*"]
