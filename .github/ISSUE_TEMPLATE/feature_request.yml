name: 功能建议
description: 新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 能否做成插件（Provider / Hook / Event）？见 docs/plugins.md
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
