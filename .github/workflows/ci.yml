name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: pip install -e ".[all,dev]"
      - name: 代码检查（ruff）
        run: ruff check .
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 模拟运行冒烟测试
        run: python -m reelay.main --dry-run

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 代码检查（ESLint）
        run: npm run lint:eslint
      - name: 单元测试（Vitest）
        run: npm test
      - name: 生产构建
        run: npm run build

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: reelay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 镜像冒烟测试
        run: docker run --rm reelay:ci python -m reelay.main --dry-run
